# ---------------------------------------------------------------------------
# Pages CMS configuration (PRD §4, §6, §11).
#
# This file is the entire CMS. It maps the Astro content collections in
# src/content.config.ts onto forms at app.pagescms.org, which commits straight
# to this repo on the editor's behalf — no database, no backend, no admin
# build to deploy. A save is a commit is a Cloudflare Pages deploy.
#
# Two rules are enforced here rather than left to whoever is typing fastest
# after a tournament (§6):
#   1. Every image field is followed by a REQUIRED alt-text field.
#   2. Anything the site derives (win rates, upcoming/past) is NOT an editable
#      field, so it can't be entered wrong or go stale.
# ---------------------------------------------------------------------------

media:
  # Media live under src/assets so Astro's <Image> can optimize them; the
  # output path is what gets written into the content files and resolved by
  # src/lib/images.ts.
  - name: images
    label: Images
    input: src/assets/img
    output: /src/assets/img
    extensions: [jpg, jpeg, png, webp, avif, svg]
    categories: [image]

content:
  # -- Team members ---------------------------------------------------------
  - name: team
    label: Team Members
    description: The people who run The Leftovers. They appear wherever a landing page has a Team members block.
    type: collection
    path: src/content/team
    filename: '{fields.name}.md'
    format: yaml-frontmatter
    view:
      fields: [name, role]
      primary: name
      sort: [order, name]
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: role, label: Role, type: string, required: true, description: 'e.g. "Organizer"' }
      - { name: photo, label: Photo, type: image, options: { media: images } }
      - name: photoAlt
        label: Photo alt text
        type: string
        required: true
        description: >-
          Describe the photo for screen readers and image search. Required
          even before there's a photo; the person's name is fine until then.
      - name: email
        label: Contact email
        type: string
        pattern: { regex: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
        description: Public. Anyone can see this on the site, so use an address that's fine to share.
      - name: socials
        label: Socials
        type: object
        fields:
          - { name: instagram, label: Instagram URL, type: string, pattern: { regex: '^https?://.+' } }
          - { name: facebook, label: Facebook URL, type: string, pattern: { regex: '^https?://.+' } }
          - { name: tiktok, label: TikTok URL, type: string, pattern: { regex: '^https?://.+' } }
          - { name: youtube, label: YouTube URL, type: string, pattern: { regex: '^https?://.+' } }
          - { name: website, label: Website URL, type: string, pattern: { regex: '^https?://.+' } }
      - { name: order, label: Sort order, type: number, default: 100, description: Lower sorts first. }
      - { name: body, label: Bio, type: rich-text }

  # -- Events ---------------------------------------------------------------
  - name: events
    label: Events
    description: >-
      Tournaments, upcoming and past. Upcoming/past is worked out from the
      date automatically — only set Status if you need to override it.
    type: collection
    path: src/content/events
    filename: '{year}-{month}-{fields.title}.md'
    format: yaml-frontmatter
    view:
      fields: [title, startDate, league]
      primary: title
      sort: [startDate, title]
    fields:
      - { name: title, label: Event name, type: string, required: true, description: 'Include the year, e.g. "Lone Star Open 2026".' }
      - {
          name: league,
          label: League / series tag,
          type: string,
          description: 'e.g. "PBLeague D4". Shown as the crimson pill on the card.',
        }
      - { name: startDate, label: Start date, type: date, required: true }
      - { name: endDate, label: End date, type: date, description: 'Leave empty for a one-day event.' }
      - name: location
        label: Location
        type: object
        description: >-
          Leave empty until the venue is confirmed. Google only shows an event
          in search once it has a venue and city, and the full address helps.
        fields:
          - { name: venue, label: Venue, type: string, required: true }
          - { name: street, label: Street address, type: string }
          - { name: city, label: City, type: string, required: true }
          - { name: region, label: State, type: string, description: 'e.g. FL' }
          - { name: postalCode, label: ZIP code, type: string }
          - { name: country, label: Country code, type: string, default: US }
          - { name: mapUrl, label: Map link, type: string, pattern: { regex: '^https?://.+' } }
      - {
          name: eventUrl,
          label: League event page,
          type: string,
          pattern: { regex: '^https?://.+' },
          description: 'The event on the league site, for details and results. Players sign up through the join form, not here.',
        }
      - name: feeDeadlines
        label: Fee deadlines
        type: object
        description: 'Last day of each fee tier. Join requests close after the Late date.'
        fields:
          - { name: early, label: Early through, type: date }
          - { name: regular, label: Regular through, type: date }
          - { name: late, label: Late through, type: date }
      - name: closedToRequests
        label: Closed to new players
        type: boolean
        default: false
        description: >-
          Tick this to replace "Request a spot" with a closed note. Leave it
          off and requests stay open until the event ends, whatever the league
          deadlines are.
      - name: fees
        label: League fees (per team)
        type: object
        list: true
        description: 'Copy these from the league fee table, only for divisions we enter.'
        fields:
          - { name: format, label: Format, type: string, required: true, description: 'e.g. X-Ball' }
          - { name: division, label: Division, type: string, required: true, description: 'e.g. Division 5' }
          - { name: early, label: Early fee, type: number, required: true }
          - { name: regular, label: Regular fee, type: number, required: true }
          - { name: late, label: Late fee, type: number, required: true }
      - name: squads
        label: Squads
        type: object
        list: true
        description: 'Every Leftovers squad entered, from the league team list. Add the place after the event.'
        fields:
          - { name: name, label: Squad name, type: string, required: true }
          - { name: division, label: Division, type: string, required: true }
          - { name: place, label: Final place, type: number }
          - { name: fieldSize, label: Teams in the division, type: number }
      - name: status
        label: Status override
        type: select
        options: { values: [upcoming, past] }
        description: >-
          Normally leave this empty. The site derives upcoming/past from the
          date, so an event can never get stuck as "upcoming".
      - { name: cover, label: Cover image, type: image, options: { media: images } }
      - { name: coverAlt, label: Cover image alt text, type: string, required: true }
      - {
          name: placement,
          label: Finish,
          type: string,
          description: 'Filled in after the event, e.g. "2nd of 12".',
        }
      - { name: resultSummary, label: Result summary, type: text, description: 'A sentence or two, after the event.' }
      - { name: body, label: Notes, type: rich-text }

  # -- Products -------------------------------------------------------------
  - name: products
    label: Shop items
    description: >-
      Teaser cards only. Checkout happens on Bonfire/Fourthwall — this site
      never handles payment, so there is no inventory to manage here (§8.2).
    type: collection
    path: src/content/products
    filename: '{fields.name}.yml'
    format: yaml
    view:
      fields: [name, price, status]
      primary: name
      sort: [order, name]
    fields:
      - { name: name, label: Product name, type: string, required: true }
      - { name: blurb, label: Description, type: text }
      - { name: image, label: Product image, type: image, options: { media: images } }
      - { name: imageAlt, label: Product image alt text, type: string, required: true }
      - { name: price, label: Price, type: number, required: true }
      - { name: currency, label: Currency, type: string, default: USD }
      - {
          name: buyUrl,
          label: Buy link,
          type: string,
          required: true,
          pattern: { regex: '^https?://.+' },
          description: 'The Bonfire or Fourthwall product/campaign URL.',
        }
      - {
          name: status,
          label: Status,
          type: select,
          default: available,
          options:
            {
              values:
                [
                  { value: 'pre-order', label: 'Pre-order (batch open)' },
                  { value: available, label: Available now },
                  { value: 'sold-out', label: Sold out / batch closed },
                ],
            },
          required: true,
        }
      - {
          name: preorderCloses,
          label: Pre-order window closes,
          type: date,
          description: 'Drives the countdown on the shop page.',
        }
      - { name: order, label: Sort order, type: number, default: 100 }

  # -- Sponsors -------------------------------------------------------------
  - name: sponsors
    label: Sponsors
    type: collection
    path: src/content/sponsors
    filename: '{fields.name}.yml'
    format: yaml
    view:
      fields: [name, tier]
      primary: name
    fields:
      - { name: name, label: Sponsor name, type: string, required: true }
      - { name: logo, label: Logo, type: image, options: { media: images } }
      - name: logoAlt
        label: Logo alt text
        type: string
        required: true
        description: 'Usually just "<Sponsor> logo".'
      - { name: url, label: Website, type: string, pattern: { regex: '^https?://.+' } }
      - {
          name: tier,
          label: Tier,
          type: select,
          default: supporting,
          options: { values: [title, gold, supporting] },
        }

  # -- Pages ----------------------------------------------------------------
  - name: pages
    label: Page copy
    description: 'Body copy, hero images and SEO metadata for Contact, Shop and Community.'
    type: collection
    path: src/content/pages
    filename: '{fields.title}.md'
    format: yaml-frontmatter
    view:
      fields: [title]
      primary: title
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - { name: eyebrow, label: Eyebrow / kicker, type: string }
      - { name: intro, label: Intro paragraph, type: text }
      - name: heroImages
        label: Hero images
        type: object
        list: true
        description: >-
          Every page opens with a hero. Leave this empty for the styled
          motif header (works fine on its own — a page never has to wait on
          photography). One photo is a static backdrop. Two or more slowly
          cross-fade between them.
        fields:
          - { name: image, label: Photo, type: image, options: { media: images }, required: true }
          - name: alt
            label: Alt text
            type: string
            description: >-
              Leave blank for a purely decorative background (the page
              title already says what the page is about). Fill in only if
              the photo shows something the heading doesn't say.
      - name: seo
        label: SEO
        type: object
        fields:
          - {
              name: title,
              label: Search-result title,
              type: string,
              description: 'Up to ~60 characters. Falls back to the page title.',
            }
          - {
              name: description,
              label: Meta description,
              type: text,
              description: 'Up to ~155 characters. This is the text Google shows.',
            }
          - { name: ogImage, label: Social share image, type: image, options: { media: images } }
          - { name: ogImageAlt, label: Social share image alt text, type: string }
          - name: noindex
            label: Hide from search engines
            type: boolean
            default: false
            description: 'Ticked: Google is told not to list this page, and it is left out of the sitemap and llms.txt. The page still works for anyone with the link.'
      - { name: body, label: Body, type: rich-text }

  # -- Landing pages --------------------------------------------------------
  # The page builder. Mirrors `landing` in src/content.config.ts; block names
  # must match the `type` literals there and the switch in BlockRenderer.astro.
  - name: landing
    label: Landing pages
    description: >-
      The page builder. Pick a hero, then add sections and drag them into
      order. Keep Status on "Draft" while you work: a draft shows at
      /preview/your-page-title about two minutes after you save, hidden from
      search engines. Publish it and it moves to /your-page-title. Don't put
      two full-width photo sections (Photo band, Photo gallery) back to back.
      See docs/EDITING.md.
    type: collection
    path: src/content/landing
    filename: '{fields.title}.yml'
    format: yaml
    view:
      fields: [title, status]
      primary: title
      sort: [title]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
        description: Also sets the page address when you first create it.
      - name: status
        label: Status
        type: select
        default: draft
        required: true
        options:
          values:
            - { value: draft, label: 'Draft (preview only)' }
            - { value: published, label: Published }
      - name: hero
        label: Hero
        type: object
        required: true
        description: The opening of the page. It always comes first and owns the main heading.
        fields:
          - name: variant
            label: Style
            type: select
            default: brand
            required: true
            options:
              values:
                - { value: ornate, label: 'Ornate (homepage showpiece)' }
                - { value: brand, label: Logo }
                - { value: image, label: Photo background }
                - { value: text, label: Text only }
          - name: title
            label: Heading
            type: string
            description: Used by the Photo and Text styles. The logo styles show the logo instead.
          - { name: tagline, label: Tagline, type: string }
          - name: image
            label: Photo
            type: image
            options: { media: images }
            description: Photo background style only.
          - { name: imageAlt, label: Photo alt text, type: string, description: Required when a photo is set. }
          - { name: animate, label: Gentle background motion, type: boolean, default: false }
          - &ctas
            name: ctas
            label: Buttons
            type: object
            list: true
            fields:
              - { name: label, label: Button text, type: string, required: true }
              - { name: href, label: Link, type: string, required: true, description: 'e.g. /join' }
              - name: variant
                label: Style
                type: select
                default: primary
                options: { values: [primary, outline, gold, ghost] }
      - name: sections
        label: Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: impactBand
            label: Photo band
            fields:
              - { name: image, label: Photo, type: image, options: { media: images }, required: true }
              - { name: imageAlt, label: Photo alt text, type: string, required: true }
              - { name: eyebrow, label: Kicker, type: string }
              - name: title
                label: Headline
                type: text
                required: true
                description: Two short lines at most. Press Enter for a line break.
              - { name: body, label: Text, type: text }
              - name: stats
                label: Stats
                type: object
                list: true
                fields:
                  - { name: value, label: Value, type: string, required: true }
                  - { name: label, label: Label, type: string, required: true }
              - name: ghost
                label: Big background word
                type: string
                description: Decoration only. Screen readers skip it.
              - { name: align, label: Text side, type: select, default: left, options: { values: [left, right] } }
              - { name: tone, label: Colour, type: select, default: ink, options: { values: [ink, crimson, forest] } }
              - { name: treatment, label: Photo treatment, type: select, default: fade, options: { values: [fade, duotone] } }
              - name: wash
                label: Photo fade
                type: select
                default: fade
                description: >-
                  "none" shows the photo edge to edge. With text or stats, also
                  set the backdrop to "panel" so the words stay readable.
                options: { values: [fade, none] }
              - { name: backdrop, label: Backdrop behind text, type: select, default: auto, options: { values: [auto, none, scrim, panel] } }
              - name: shift
                label: Slide the photo sideways
                type: number
                description: -30 to 30. Negative moves it left. Desktop only.
              - name: focus
                label: Photo focus point
                type: string
                description: 'e.g. "70% 30%". Leave empty for the centre.'
              - *ctas
          - name: statement
            label: Big statement
            fields:
              - { name: framed, label: Decorative rule above and below, type: boolean, default: false }
              - { name: eyebrow, label: Kicker, type: string }
              - { name: lines, label: Lines, type: string, list: true, required: true }
          - name: divider
            label: Divider
            fields:
              - name: ornament
                label: Ornament
                type: select
                default: peaks
                options:
                  values:
                    - { value: peaks, label: 'Peaks (terraced range)' }
                    - { value: field, label: 'Field (one small glyph, the quietest)' }
                    - { value: cloud, label: 'Cloud (formal, for big breaks)' }
              - { name: spacing, label: Space around it, type: select, default: md, options: { values: [sm, md, lg] } }
          - name: gallery
            label: Photo gallery
            fields:
              - name: gallery
                label: Gallery
                type: reference
                required: true
                options: { collection: galleries, value: '{name}', label: '{fields.title}' }
              - name: layout
                label: Layout
                type: select
                default: showcase
                options: { values: [showcase, hero, peek, single] }
          - name: twoColumn
            label: Photo and text
            fields:
              - &tone { name: tone, label: Background, type: select, default: base, options: { values: [base, alt, topo, sand, seigaiha] } }
              - { name: eyebrow, label: Kicker, type: string }
              - { name: title, label: Heading, type: string, required: true }
              - { name: image, label: Photo, type: image, options: { media: images } }
              - { name: imageAlt, label: Photo alt text, type: string, required: true }
              - { name: imageSide, label: Photo side, type: select, default: right, options: { values: [left, right] } }
              - { name: body, label: Text, type: text }
              - name: steps
                label: Numbered steps
                type: object
                list: true
                fields:
                  - { name: lead, label: Bold lead-in, type: string, required: true }
                  - { name: text, label: Sentence, type: string, required: true }
              - *ctas
          - name: announcement
            label: Announcement panel
            fields:
              - *tone
              - { name: eyebrow, label: Kicker, type: string }
              - { name: title, label: Section heading, type: string }
              - { name: heading, label: Panel heading, type: string, required: true }
              - { name: body, label: Text, type: text }
              - *ctas
              - { name: showLeagues, label: Show league logos, type: boolean, default: false }
              - { name: leaguesLabel, label: Logo row label, type: string }
          - name: threeColumn
            label: Three columns
            fields:
              - *tone
              - { name: eyebrow, label: Kicker, type: string }
              - { name: title, label: Heading, type: string }
              - { name: layout, label: Layout, type: select, default: card, options: { values: [card, centered] } }
              - name: items
                label: Columns
                type: object
                list: true
                required: true
                fields:
                  - { name: title, label: Title, type: string, required: true }
                  - { name: body, label: Text, type: text, required: true }
          - name: featureRow
            label: Feature row
            fields:
              - { name: eyebrow, label: Kicker, type: string }
              - { name: title, label: Heading, type: string, required: true }
              - { name: body, label: Text, type: text, required: true }
              - { name: image, label: Photo, type: image, options: { media: images } }
              - { name: imageAlt, label: Photo alt text, type: string, required: true }
              - { name: reverse, label: Photo on the other side, type: boolean, default: false }
              - { name: ctaLabel, label: Button text, type: string }
              - { name: ctaHref, label: Button link, type: string }
          - name: prose
            label: Text
            fields:
              - *tone
              - { name: eyebrow, label: Kicker, type: string }
              - { name: title, label: Heading, type: string }
              - name: body
                label: Text
                type: text
                required: true
                description: Leave a blank line between paragraphs.
          - name: ctaStrip
            label: Call to action strip
            fields:
              - { name: tone, label: Colour, type: select, default: crimson, options: { values: [crimson, forest] } }
              - { name: eyebrow, label: Kicker, type: string }
              - { name: title, label: Heading, type: string, required: true }
              - { name: body, label: Text, type: text }
              - *ctas
          - name: newsletter
            label: Newsletter signup
            fields:
              - *tone
              - { name: eyebrow, label: Kicker, type: string }
              - { name: title, label: Heading, type: string }
              - { name: body, label: Text, type: text }
          - name: team
            label: Team members
            fields:
              - *tone
              - { name: eyebrow, label: Kicker, type: string }
              - { name: title, label: Heading, type: string }
          - name: quote
            label: Quote
            fields:
              - *tone
              - { name: eyebrow, label: Kicker, type: string }
              - { name: title, label: Heading, type: string }
              - { name: quote, label: Quote, type: text, required: true, description: Their exact words. Get their OK before quoting someone by name. }
              - { name: cite, label: Who said it, type: string, required: true }
              - { name: source, label: Where or when, type: string, description: 'e.g. "NXL World Cup, 2024"' }
              - { name: sourceUrl, label: Link to the original, type: string, pattern: { regex: '^https?://.+' }, description: 'Turns "Where or when" into a link, so fill that in too.' }
              - { name: image, label: Photo, type: image, options: { media: images }, description: Optional. A tall photo works best. Without one the quote is centred. }
              - { name: imageAlt, label: Photo alt text, type: string, description: Required when a photo is set. }
          - name: faq
            label: FAQs
            fields:
              - *tone
              - { name: eyebrow, label: Kicker, type: string }
              - { name: title, label: Heading, type: string }
      - name: seo
        label: SEO
        type: object
        fields:
          - name: title
            label: Search-result title
            type: string
            description: Up to ~60 characters. Falls back to the page title.
          - { name: description, label: Meta description, type: text, description: Up to ~155 characters. }
          - { name: ogImage, label: Social share image, type: image, options: { media: images } }
          - { name: ogImageAlt, label: Social share image alt text, type: string }
          - { name: noindex, label: Hide from search engines, type: boolean, default: false }

  # -- Pre-order drops ------------------------------------------------------
  - name: preorders
    label: Pre-order drops
    description: >-
      Batch jersey drops with an on-site order form. Orders close automatically
      on the deadline. Keep Status on "draft" until it's ready — draft drops
      aren't published at all. See docs/PREORDERS.md.
    type: collection
    path: src/content/preorders
    filename: '{year}-{fields.title}.md'
    format: yaml-frontmatter
    view:
      fields: [title, status, closesAt, price]
      primary: title
      sort: [closesAt, title]
    fields:
      - { name: title, label: Drop name, type: string, required: true }
      - { name: eyebrow, label: Kicker, type: string, description: 'e.g. "Breast Cancer Awareness"' }
      - name: status
        label: Status
        type: select
        default: draft
        required: true
        options:
          values:
            - { value: draft, label: Draft (not published) }
            - { value: open, label: Open — taking orders }
            - { value: closed, label: Closed }
            - { value: fulfilled, label: Fulfilled / shipped }
      - name: closesAt
        label: Orders close
        type: date
        required: true
        description: >-
          The deadline. Drives the countdown and closes the form automatically
          — you don't need to come back and switch it off.
      - { name: price, label: Price per jersey, type: number, required: true }
      - { name: currency, label: Currency, type: string, default: USD }
      - { name: priceNote, label: Price note, type: string, description: 'e.g. "shipped anywhere in the US"' }
      - name: variants
        label: Versions
        type: object
        list: true
        required: true
        fields:
          - { name: name, label: Version name, type: string, required: true }
          - { name: description, label: Description, type: text }
          - { name: image, label: Mockup image, type: image, options: { media: images } }
          - { name: imageAlt, label: Mockup alt text, type: string, required: true }
      - name: sizes
        label: Sizes offered
        type: string
        list: true
        required: true
        description: >-
          ⚠️ These must match the linked Google Form's size options EXACTLY
          ("Large", not "L"). Google discards a multiple-choice answer it
          doesn't recognise, and it does so silently.
      - name: deliveryOptions
        label: Delivery options
        type: string
        list: true
        description: >-
          ⚠️ Must match the Google Form's delivery options exactly, for the
          same reason as Sizes above. Leave empty to hide the question.
      - name: customisation
        label: Per-jersey customisation
        type: object
        fields:
          - { name: nameOnBack, label: Collect name on back, type: boolean, default: true }
          - { name: numberOnBack, label: Collect number on back, type: boolean, default: true }
      - name: cause
        label: Cause (optional)
        type: object
        description: >-
          Leave empty for a normal drop. If you fill it in, keep "Jerseys sold
          so far" current — the progress bar is calculated from it and nothing
          counts orders automatically.
        fields:
          - { name: name, label: Charity name, type: string }
          - { name: url, label: Charity website, type: string, pattern: { regex: '^https?://.+' } }
          - { name: donationPerUnit, label: Donation per jersey, type: number }
          - { name: goalUnits, label: Goal (jerseys), type: number }
          - { name: unitsSold, label: Jerseys sold so far, type: number, default: 0 }
      - name: paymentMethods
        label: How people can pay
        type: object
        list: true
        fields:
          - { name: label, label: Method, type: string, required: true }
          - { name: handle, label: Handle / details, type: string }
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title, label: Search-result title, type: string }
          - { name: description, label: Meta description, type: text }
          - name: noindex
            label: Hide from search engines
            type: boolean
            default: false
            description: 'Ticked: Google is told not to list this drop, and it is left out of the sitemap and llms.txt.'
      - { name: body, label: The pitch, type: rich-text }

  # -- Galleries ------------------------------------------------------------
  - name: galleries
    label: Photo galleries
    description: >-
      Every photo here shows on the Gallery page. One entry per set — an event,
      a season, a jersey drop. Every photo needs alt text.
    type: collection
    path: src/content/galleries
    filename: '{fields.title}.yml'
    format: yaml
    view:
      fields: [title, order]
      primary: title
      sort: [order, title]
    fields:
      - { name: title, label: Gallery title, type: string, required: true }
      - { name: order, label: Sort order, type: number, default: 1 }
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, options: { media: images }, required: true }
          - name: alt
            label: Alt text
            type: string
            required: true
            description: >-
              Describe what's happening in the shot. Read aloud to blind
              visitors and indexed by image search.
          - name: caption
            label: Headline (optional)
            type: string
            description: >-
              The big line shown on this photo in the homepage slider, e.g.
              "Off the break". Keep it to a few words. Left empty, the slide
              shows only the kicker below.
          - name: kicker
            label: Kicker (optional)
            type: string
            description: >-
              The small gold line above the headline, e.g. the event and year.
              Left empty, it uses the gallery title.

  # -- FAQs -----------------------------------------------------------------
  - name: faqs
    label: FAQs
    description: 'Not shown on the site yet, unless added to a landing page with the FAQs section.'
    type: file
    path: src/content/faqs.yml
    format: yaml
    list: true
    fields:
      - { name: id, label: ID, type: string, required: true, description: 'Lowercase, no spaces. Used as the anchor.' }
      - { name: question, label: Question, type: string, required: true }
      - { name: answer, label: Answer, type: text, required: true }
      - { name: order, label: Sort order, type: number, default: 100 }

  # -- Site settings --------------------------------------------------------
  - name: settings
    label: Site settings
    description: 'Nav, social links, the mailing-list endpoint and shop URLs.'
    type: file
    path: src/data/site.yml
    format: yaml
    fields:
      - { name: title, label: Site title, type: string, required: true }
      - { name: tagline, label: Tagline, type: string, required: true }
      - name: homeTitle
        label: Homepage search title
        type: string
        description: 'The title Google shows for the homepage. Under ~60 characters.'
      - name: description
        label: Default meta description
        type: text
        required: true
        description: 'Up to ~155 characters. Used by any page that has no description of its own.'
      - { name: established, label: Established (year), type: number, required: true }
      - { name: homeBase, label: Home base, type: string, required: true }
      - name: nav
        label: Navigation
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: href, label: Path, type: string, required: true }
      - name: footerNav
        label: Footer-only links
        type: object
        list: true
        description: Shown in the footer after the navigation links, but not in the header.
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: href, label: Path, type: string, required: true }
      - name: primaryCta
        label: Header button
        type: object
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: href, label: Link, type: string, required: true }
      - name: social
        label: Social links
        type: object
        fields:
          - { name: instagram, label: Instagram, type: string }
          - { name: facebookGroup, label: Facebook group, type: string }
          - { name: discord, label: Discord invite, type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: tiktok, label: TikTok, type: string }
          - { name: email, label: Contact email, type: string, required: true }
      - name: discordServerId
        label: Discord server ID
        type: string
        description: >-
          Numeric server ID. Renders Discord's official free widget on the
          Community page. Leave empty to show a link-out card instead.
      - name: instagramWidget
        label: Instagram feed widget
        type: object
        description: >-
          Instagram has no casual live-feed API, so a grid needs a third-party
          aggregator (Elfsight / Juicer / SnapWidget). Paste its script here.
          Left empty, the page shows a link-out card rather than a hole.
        fields:
          - { name: provider, label: Provider name, type: string }
          - { name: scriptSrc, label: Widget script URL, type: string }
          - { name: elementClass, label: Widget element class, type: string }
      - name: eventProcess
        label: How event sign-up works
        type: object
        description: 'The numbered steps on the Events and Join pages.'
        fields:
          - name: steps
            label: Steps
            type: object
            list: true
            fields:
              - { name: title, label: Step, type: string, required: true }
              - { name: body, label: Details, type: text, required: true }
          - { name: feeNote, label: Note under the fee table, type: text }
      - name: mailingList
        label: Mailing list
        type: object
        description: 'The signup form posts straight to this provider — no data touches our site.'
        fields:
          - {
              name: provider,
              label: Provider,
              type: select,
              options: { values: [buttondown, mailchimp] },
              required: true,
            }
          - { name: formAction, label: Form action URL, type: string, required: true }
          - { name: emailFieldName, label: Email field name, type: string, default: email }
      - name: preorderForm
        label: Pre-order form
        type: object
        description: >-
          Where the on-site order form posts. Empty = the form shows a "not
          connected" notice instead of losing orders. See docs/PREORDERS.md.
        fields:
          - { name: provider, label: Provider name, type: string }
          - { name: endpoint, label: Form endpoint URL, type: string }
          - name: turnstileSiteKey
            label: Turnstile site key
            type: string
            description: >-
              Only real bot protection once the endpoint verifies the token
              server-side. A key on its own is decoration.
      - name: shop
        label: Shop links
        type: object
        fields:
          - { name: bonfireUrl, label: Bonfire store URL, type: string }
          - { name: alwaysOpenUrl, label: 'Always-open store URL', type: string }
      - name: leagues
        label: Leagues
        type: object
        list: true
        description: 'Logo row on the homepage calendar block: the leagues the team wants to play in.'
        fields:
          - { name: name, label: League name, type: string, required: true }
          - { name: logo, label: Logo, type: image, options: { media: images }, required: true }
          - { name: logoAlt, label: Logo alt text, type: string, required: true }
      - { name: footerNote, label: Footer note, type: text, required: true }
      - name: datadogRum
        label: Datadog RUM
        type: object
        description: 'Performance and error monitoring. Loads only for visitors who accept analytics. Off until Application ID and Client token are both set.'
        fields:
          - { name: applicationId, label: Application ID, type: string }
          - { name: clientToken, label: Client token, type: string, description: 'Starts with "pub". Public by design.' }
          - { name: remoteConfigurationId, label: Remote configuration ID, type: string, description: 'Optional. Lets sampling be changed in Datadog without a deploy.' }
          - name: site
            label: Datadog site
            type: select
            default: datadoghq.com
            options:
              values:
                - { value: datadoghq.com, label: 'US1 (datadoghq.com)' }
                - { value: us3.datadoghq.com, label: 'US3' }
                - { value: us5.datadoghq.com, label: 'US5' }
                - { value: datadoghq.eu, label: 'EU1 (datadoghq.eu)' }
                - { value: ap1.datadoghq.com, label: 'AP1' }
                - { value: ap2.datadoghq.com, label: 'AP2' }
          - { name: service, label: Service name, type: string, default: the-leftovers }
          - { name: env, label: Environment, type: string, default: production }
          - { name: sessionSampleRate, label: Sessions recorded (%), type: number, default: 100 }
          - { name: sessionReplaySampleRate, label: Session Replay (%), type: number, default: 0, description: '0 turns Session Replay off.' }
          - name: defaultPrivacyLevel
            label: Replay privacy
            type: select
            default: mask-user-input
            options:
              values:
                - { value: mask-user-input, label: 'Mask what visitors type (recommended)' }
                - { value: mask, label: 'Mask all text' }
                - { value: allow, label: 'Mask nothing' }
      - name: search
        label: Search engines & AI crawlers
        type: object
        fields:
          - name: googleSiteVerification
            label: Google Search Console verification code
            type: string
            description: 'Only for an "URL prefix" property verified by HTML tag: paste just the content="…" value. A Domain property (verified by DNS) needs nothing here.'
          - name: bingSiteVerification
            label: Bing Webmaster verification code
            type: string
            description: 'The content="…" value of Bing''s msvalidate.01 tag. Or import the site from Google Search Console in Bing and leave this blank.'
          - name: aiCrawlers
            label: AI crawlers
            type: select
            default: allow
            description: 'Google and Bing search are always allowed. This only changes AI bots (ChatGPT, Claude, Perplexity, Gemini training…).'
            options:
              values:
                - { value: allow, label: 'Allow all (most visibility)' }
                - { value: search-only, label: 'AI search answers only, no AI training' }
                - { value: block, label: 'Block all AI bots' }
      - {
          name: gtmId,
          label: Google Tag Manager ID,
          type: string,
          description: 'Container ID (e.g. GTM-KPXD7QD6). Loaded only after a visitor accepts analytics cookies.',
        }
