# ---------------------------------------------------------------------------
# site-settings (PRD §6) — the one file a non-developer edits to change nav
# labels, social links, and the mailing-list endpoint. Edited in Pages CMS.
# ---------------------------------------------------------------------------
title: The Leftovers
tagline: Play / Compete / Leftovers
description: >-
  The Leftovers are a community-run paintball team built from rotating free
  agents. There's no tryout and no bench — if you can make the date and cover
  your own entry, you can play a tournament with us.
established: 2022
# Optional. Leave blank until the team decides how it wants to describe its
# region; it feeds the footer and the SportsTeam structured data.
homeBase: ''

nav:
  - label: Home
    href: /
  - label: About
    href: /about
  - label: Roster
    href: /roster
  - label: Events
    href: /events
  - label: Stats
    href: /stats
  - label: Shop
    href: /shop
  - label: Community
    href: /community
  - label: Contact
    href: /contact

primaryCta:
  label: Join the Team
  href: /roster#open-slots

# The handle is `leftoverspb` nearly everywhere.
#
# Note `facebook` is a PAGE (facebook.com/leftoverspb), not a Group
# (facebook.com/groups/...). That matters: PRD §8.3 ruled out embedding a
# feed because Groups can't be embedded by anyone — but Meta's Page Plugin
# CAN embed a Page. See `facebookPagePlugin` below.
social:
  instagram: https://www.instagram.com/leftoverspb/
  facebookGroup: https://www.facebook.com/leftoverspb
  discord: https://discord.gg/
  youtube: https://www.youtube.com/@leftoverspb
  tiktok: https://www.tiktok.com/@leftoverspb
  email: team@theleftoverspb.com

# Meta's Page Plugin can embed a public Page's feed, unlike a Group. It is
# OFF by default on purpose: the plugin loads Meta's SDK, which sets cookies
# and would make the footer's "no trackers, no cookies" line untrue. Turn it
# on only alongside changing that copy — and allowlist facebook.net /
# facebook.com in public/_headers.
facebookPagePlugin:
  enabled: false
  pageUrl: https://www.facebook.com/leftoverspb

# Discord's official, free server widget (§8.3). Put the numeric server ID
# here to render the live member count block on /community.
discordServerId: ''

# Instagram feed widget (§8.3). Paste the <script> src from the chosen
# provider's free tier (Elfsight / Juicer / SnapWidget) and its element class.
instagramWidget:
  provider: ''
  scriptSrc: ''
  elementClass: ''

# Mailing list: a native <form> posting straight to the provider, so no PII
# ever touches our infrastructure (§4, §8.3).
mailingList:
  provider: buttondown
  formAction: https://buttondown.com/api/emails/embed-subscribe/theleftovers
  emailFieldName: email
  # Buttondown wants this hidden field; Mailchimp uses a different scheme.
  hiddenFields:
    embed: '1'

shop:
  # Bonfire campaign for evergreen items (§8.2). Batch jersey drops are taken
  # through the on-site pre-order form below instead, because they need
  # per-jersey customisation Bonfire can't collect.
  bonfireUrl: ''
  alwaysOpenUrl: ''

# On-site pre-order form. See docs/PREORDERS.md for the two backends.
# Empty endpoint = the form renders a "not connected" notice instead of
# silently swallowing orders.
preorderForm:
  provider: ''
  endpoint: ''
  # Cloudflare Turnstile. Only real protection once the endpoint verifies the
  # token server-side — a site key alone is decoration.
  turnstileSiteKey: ''

footerNote: >-
  Free agents welcome. Show up, pay your entry, play the tournament —
  that's the whole tryout.
