# ---------------------------------------------------------------------------
# site-settings (PRD §6) — the one file a non-developer edits to change nav
# labels, social links, and the mailing-list endpoint. Edited in Pages CMS.
# ---------------------------------------------------------------------------
title: The Leftovers
tagline: Play / Compete / Leftovers
# The search-result title for the homepage. Other pages use "Page | The
# Leftovers". Keep it under ~60 characters.
homeTitle: The Leftovers — Community Paintball Team for Free Agents
# The default meta description, used wherever a page doesn't set its own.
# Keep it under ~155 characters: that's what Google shows before cutting off.
description: >-
  A community-run paintball team built from rotating free agents. No tryout,
  no bench: make the date, cover your entry and play a tournament with us.
established: 2022
# Optional. Leave blank until the team decides how it wants to describe its
# region; it feeds the footer and the SportsTeam structured data.
homeBase: ""

# Team, Events, Shop and Community are hidden for now (website feedback,
# Nov 2026): the team wants to build them out properly first. The pages still
# build, but they are noindex, out of the sitemap, and nothing links to them.
# To bring one back: re-add it here and untick "Hide from search engines"
# (seo.noindex) on its Page copy entry.
nav:
  - label: Home
    href: /
  - label: Contact
    href: /contact

primaryCta:
  label: Join a squad
  href: /join

# The handle is `leftoverspb` nearly everywhere.
#
# Note `facebook` is a PAGE (facebook.com/leftoverspb), not a Group
# (facebook.com/groups/...). That matters: PRD §8.3 ruled out embedding a
# feed because Groups can't be embedded by anyone — but Meta's Page Plugin
# CAN embed a Page. See `facebookPagePlugin` below.
social:
  instagram: https://www.instagram.com/leftoverspb/
  facebookGroup: https://www.facebook.com/leftoverspb
  # We do not officially run a Discord right now. Leave this blank — every
  # Discord-specific UI element (nav/footer icon, community page section,
  # "ask in the Discord" CTAs) already checks for a value here and hides
  # itself when it's empty, same pattern as `mailingList.formAction` below.
  # Fill it back in whenever there's a real invite link to point at.
  discord: ""
  tiktok: https://www.tiktok.com/@leftoverspb
  email: info@theleftoverspb.com

# Meta's Page Plugin can embed a public Page's feed, unlike a Group. It is
# OFF by default on purpose: the plugin loads Meta's SDK, which sets third-party
# cookies without consent. If turned on, gate it behind CookieConsent and
# allowlist facebook.net / facebook.com in public/_headers.
facebookPagePlugin:
  enabled: false
  pageUrl: https://www.facebook.com/leftoverspb

# Google Tag Manager container ID. Loaded only after a visitor grants
# analytics consent in CookieConsent (EU / GDPR opt-in). Leave blank to
# disable analytics and hide the consent banner.
gtmId: GTM-KPXD7QD6

# Datadog Real User Monitoring (docs/ANALYTICS.md). Like GTM, it only loads
# after a visitor clicks "Accept analytics". Off until applicationId and
# clientToken are both filled in. Both are public values, safe to commit.
datadogRum:
  applicationId: e20a2262-d00c-4979-8cd1-62dbcc3ba4b4
  clientToken: pub469bc3a1c76d6f1c29313eafac5a3525
  # Lets sampling and other options be changed in Datadog's UI without a
  # deploy. Values set there override the ones below.
  remoteConfigurationId: 53936841-a219-484e-89df-1a54167f73b4
  # Your Datadog region: datadoghq.com (US1), us3.datadoghq.com,
  # us5.datadoghq.com, datadoghq.eu, ap1.datadoghq.com…
  site: datadoghq.com
  service: the-leftovers
  env: production
  # Percent of consenting visitors' sessions to record (0–100).
  sessionSampleRate: 100
  # Percent of those to also capture as Session Replay. 0 = off.
  sessionReplaySampleRate: 20
  # Replay privacy: mask | mask-user-input | allow.
  defaultPrivacyLevel: mask-user-input

# Search engines and AI crawlers (docs/SEO.md).
search:
  # Only needed for a Search Console "URL prefix" property verified by HTML
  # tag. A "Domain" property is verified by DNS and needs nothing here.
  googleSiteVerification: ""
  bingSiteVerification: ""
  # allow | search-only | block. Controls robots.txt for AI bots only;
  # Google and Bing search are always allowed.
  aiCrawlers: allow

# Discord's official, free server widget (§8.3). Put the numeric server ID
# here to render the live member count block on /community.
discordServerId: ""

# Instagram feed widget (§8.3). Paste the <script> src from the chosen
# provider's free tier (Elfsight / Juicer / SnapWidget) and its element class.
instagramWidget:
  provider: ""
  scriptSrc: ""
  elementClass: ""

# Mailing list. A native <form> posting straight to a provider, so no PII ever
# touches our infrastructure (§4, §8.3).
#
# No provider is chosen yet and the team doesn't want to commit to one. With
# `formAction` empty the newsletter block points people at the community
# channels instead of rendering a form that posts nowhere.
mailingList:
  provider: ""
  formAction: ""
  emailFieldName: email
  hiddenFields: {}

shop:
  # Bonfire campaign for evergreen items (§8.2). Batch jersey drops are taken
  # through the on-site pre-order form below instead, because they need
  # per-jersey customisation Bonfire can't collect.
  bonfireUrl: ""
  alwaysOpenUrl: ""

# On-site pre-order form. See docs/PREORDERS.md.
#
# Leave `endpoint` EMPTY and the form still works: it prices and formats the
# order, then hands it to the buyer to email or paste. No account, no cap, no
# tool to commit to.
#
# To post automatically, set `endpoint` and (for a Google Form)
# provider: google-form plus the googleFormFields map below.
preorderForm:
  provider: google-form
  endpoint: https://docs.google.com/forms/d/e/1FAIpQLSfLHwT4Z3KBbdlC9PiD1aLS3VmOV6artoKhnygFCFRjWOxFLw/formResponse
  # Cloudflare Turnstile can't be verified by a Google Form (nothing runs
  # server-side), so leave this empty until the endpoint is a real function.
  turnstileSiteKey: ""
  # Our field name -> the form's entry id. Read off the live form's own
  # definition rather than guessed. Every one is OPTIONAL on the form, so a
  # blank value can't cause a silent rejection.
  #
  # The form is shaped one-jersey-per-response, so a multi-jersey order sends
  # one response PER JERSEY — which is what you want for a print list anyway.
  googleFormFields:
    fullName: entry.1131801463
    email: entry.290171208
    phone: entry.594193250
    variant: entry.684063294
    size: entry.464995239
    wantsCustomName: entry.1643166177
    nameOnBack: entry.1188798159
    numberOnBack: entry.2064202525
    delivery: entry.941658169
    address: entry.1692716281
    paymentMethod: entry.1394264392

# Leagues the team wants to build a presence in. Shown as a logo row on the
# homepage calendar block. Logos live in src/assets/img/leagues/.
leagues:
  - name: NXL (US)
    logo: /src/assets/img/leagues/nxl-us.png
    logoAlt: NXL Paintball logo
  - name: NXL Europe
    logo: /src/assets/img/leagues/nxl-eu.png
    logoAlt: NXL Paintball Europe logo
  - name: ICPL
    logo: /src/assets/img/leagues/icpl.png
    logoAlt: ICPL, International Classic Paintball League, logo

footerNote: >-
  Free agents welcome. Show up, pay your entry, play the tournament —
  that's the whole tryout.


# pblidb.org team stats (unofficial, third-party — derived from public
# PBLeague pages, not affiliated with PBLI). `query` is sent to their team
# search at build time; every matching team gets its own stats widget on
# /team, since pblidb has indexed several unrelated-but-similarly-named
# "Leftovers" teams across seasons and divisions. Leave blank to turn the
# section off without a code change.
pblidb:
  query: leftovers

# /join — request-to-play form. Leave `endpoint` EMPTY and the form still
# works: it formats the request and hands it to the requester to send
# themselves (same handoff pattern as `preorderForm` below). To collect
# requests straight into a Google Sheet instead, create a Google Form with
# fields matching the ones below (full name, email, phone, event, division,
# player class, payment method, notes), set `provider: google-form`,
# `endpoint` to its `formResponse` URL, and `fieldMap` to its `entry.NNN`
# ids — see docs/PREORDERS.md for how to read those ids off a form.
join:
  provider: google-form
  endpoint: https://docs.google.com/forms/d/e/1FAIpQLScXBRfpLmXtatUdaNnr0ZoZVjsj37KAlhDHCFx7g8sBRC6XJQ/formResponse
  # Our field name -> the form's entry id. Read off the live form's own
  # definition rather than guessed, same process as `preorderForm` above.
  fieldMap:
    firstName: entry.191847278
    lastName: entry.2076025780
    email: entry.1948955686
    phone: entry.1208301590
    facebookProfile: entry.534807610
    playerClass: entry.1242491412
    country: entry.645828190
    event: entry.1976036833
    division: entry.1734295414
    position: entry.1776045942
    teamSize: entry.1974396290
    paymentMethod: entry.453493553
    notes: entry.1626376368
  # The Event dropdown. Word each one EXACTLY as the Google Form's Event
  # question does: the site posts this string as the answer, and a value the
  # form doesn't list can be dropped. Add the event here and in the Google
  # Form together, and remove both once it has passed.
  events:
    - NXL World Cup 2026
  # Payment is arranged directly with the captain once a spot is confirmed —
  # nothing is charged through the site. Add/remove methods here; they show
  # up as a dropdown on the join form. `handle` is optional: this just needs
  # to know the requester's preferred method so the captain can send a
  # payment request through it — the actual handle isn't needed here for
  # that. Add one later if it's ever useful to show up front.
  paymentMethods:
    - label: Venmo
    - label: Zelle
    - label: PayPal
