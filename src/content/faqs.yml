- id: who-can-join
  question: Who can actually join the roster?
  answer: >-
    Anyone who can make the date, cover their own entry fee and paint, and
    isn't a problem to be around. We're a rotating free-agent roster by
    design — most of the team started as someone who filled an open slot for
    one Saturday.
  order: 1
- id: skill-level
  question: Do I need tournament experience?
  answer: >-
    No. About half the current roster had never played a registered event
    before their first one with us. If you've played rec ball and you listen
    in the huddle, you'll be fine — we're a community team, not a pro one.
  order: 2
- id: cost
  question: What does it cost to play an event with you?
  answer: >-
    It depends on the event, format and division: each league sets its own
    fees, and they rise as deadlines pass. Your event captain tells you your
    event fee before you pay, and you pay it to the captain, who registers
    the team. Paint and air on the day are on you, and there are no team dues.
  order: 3
- id: gear
  question: What gear do I need?
  answer: >-
    Your own marker, mask, pods and a harness. If you're short a piece, tell
    your event captain — somebody on the roster has a spare almost every time.
  order: 4
- id: jersey
  question: Do I have to buy a jersey?
  answer: >-
    Not to play. Jerseys run as batched pre-orders a couple of times a season
    on Bonfire, so if you miss a window you just wait for the next one and
    play in black in the meantime.
  order: 5
- id: how-to-start
  question: How do I get on the list for the next event?
  answer: >-
    Sign up on the player app, then ask for a spot with the event, division,
    format and position you want. The event captain sorts requests into squads,
    confirms your spot and your fee, and registers the team once you've paid.
  order: 6
- id: why-18
  question: Why do I have to be 18 to make an account?
  answer: >-
    Your account holds your details and is where you agree to our terms and pay
    your entry fee, so it needs to belong to an adult. Under 18? A parent or
    guardian makes the account and adds you to it, and you don't need a login of
    your own.
  order: 7
