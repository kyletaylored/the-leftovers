sections:
  - type: prose
    tone: base
    eyebrow: How it started
    title: Built for players without a squad
    body: |-
      Matt Engles spent years as a free agent for hire, jumping onto squads around the country and getting to know players from all over. Some of Matt's best friends came from teams thrown together at the last minute.

      By 2022 Matt was the NXL's marketing and media director, and kept hearing the same thing from players: they couldn't make an event because they didn't have a squad. So Matt posted that a free-agent D5 X-ball team was forming. The players loved it, and the program has kept growing ever since.
  - { type: divider, ornament: cloud, spacing: sm }
  - type: quote
    quote: I'll keep making teams as long as people keep wanting to play.
    cite: Matt Engles
    source: Planet Paintball Podcast, Ep 104
    sourceUrl: https://open.spotify.com/episode/3Ag1mlyud2KpMB9fl8SM2T
    image: /src/assets/img/events/nxl-lso26/lo2nxllso26-132-x5.webp
    imageAlt: Matt Engles in a cap and sunglasses talks Leftovers players through a clipboard, in black and white.
    align: right
    shift: -14
    focus: 30% 12%
  - type: featureRow
    eyebrow: The name
    title: Why "The Leftovers"?
    body: That first team was joking around in the group chat about feeling like leftover scraps, and the name stuck. It fits, too. These are the players who didn't get picked for dodgeball, banding together anyway. The takeout box came later, because Chinese food is always good again the next day.
    image: /src/assets/img/events/nxl-lsm25/satnxllsm25ls-1901-x5.webp
    imageAlt: A group of Leftovers teammates in mud-spotted black and red jerseys pose in two rows in front of a tent.
