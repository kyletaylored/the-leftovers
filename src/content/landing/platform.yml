# The player app's landing page. Hidden while it's a draft: it builds at
# /preview/platform, with no nav link, a noindex tag and no sitemap entry.
# To publish it at /platform, set status to published. The app screenshots
# in src/assets/img/app come from the app's demo build, so every name and
# number in them is sample data.
title: Player app
status: draft
hero:
  variant: image
  title: The Leftovers app
  tagline: Sign up once / Play all season
  image: /src/assets/img/events/nxl-lso26/lo2nxllso26-160-x5.webp
  imageAlt: Leftovers players in team jerseys pose under a tent, some crouching in front and one holding a clipboard.
  ctas:
    - { label: Request access, href: 'https://app.theleftoverspb.com', variant: gold }
    - { label: How joining works, href: /join, variant: outline }
sections:
  - type: statement
    framed: true
    eyebrow: One place for every event
    lines:
      - No more forms.
      - No more spreadsheets.
      - No chasing who paid.
  - type: threeColumn
    tone: alt
    eyebrow: For players
    title: Your season in one place
    layout: inline
    iconStyle: circle
    items:
      - icon: calendar
        title: Request a spot
        body: Pick an open event and the divisions you'd play, then follow your squad from requested to paid and on the roster.
      - icon: wallet
        title: Pay your share
        body: Pay by Zelle, Venmo and more with your own reference code. Staff confirm it, and it shows in your history.
      - icon: bell
        title: Push notifications
        body: Your phone tells you when you're offered a spot, your payment lands or a notice goes out.
      - icon: phone
        title: No app to download
        body: It runs in your browser. Add it to your Home Screen and it opens like any other app.
      - icon: jersey
        title: Your player card
        body: Your APPA ID, positions, ranking and links in one profile. Share a public card if you want to.
      - icon: users
        title: Bring the family
        body: Parents can sign up their kids and manage every profile from one account.
  - type: featureRow
    eyebrow: Made for your phone
    title: Know where you stand
    body: The next event, what you owe and how your squad is coming along, on one screen. Add it to your Home Screen and sign in with an email link, so there's no password to remember.
    image: /src/assets/img/app/player-home.webp
    imageAlt: "The app's Home screen with sample data: a welcome for the next event, a reminder to pay a $105 deposit, the balance due, and a squad's progress from registered to rostered."
    frame: phone
  - type: featureRow
    eyebrow: Paying
    title: Pay your share, your way
    body: Your reference code, what's due now and the ways to pay are all here. Tap Report payment once it's sent, and staff confirm it.
    image: /src/assets/img/app/player-payments.webp
    imageAlt: "The app's Payments screen with sample data: a payment reference, $105 due now of $313, tabs for Zelle, Venmo, PayPal and Wise, and a Report payment button."
    frame: phone
    reverse: true
  - type: threeColumn
    tone: alt
    eyebrow: For captains and staff
    title: Run an event from your phone
    layout: inline
    iconStyle: circle
    items:
      - icon: calendar
        title: Import from PBLeagues
        body: Pick the event and its dates, venue and divisions fill in. Change anything before you save.
      - icon: jersey
        title: Build squads
        body: Place players by division and position, then send offers when the squad looks right.
      - icon: wallet
        title: Track every dollar
        body: Set each squad's share with the calculator, confirm payments by reference code and see who's short before the league deadline.
      - icon: check
        title: Rosters ready
        body: Names and player IDs for every squad in one place when it's time to send the roster.
      - icon: chat
        title: Post notices
        body: Write to everyone, one event or one squad. Players see it in the app and on their phone.
      - icon: users
        title: Staff and approvals
        body: Add staff and captains by email. Captains only see their own squads, and you let new sign-ups in.
  - type: featureRow
    eyebrow: Running an event
    title: Every event in five steps
    body: Entries, requests, squads, payments and rosters, each showing what's left to do. See at a glance which squads are full and which are still short of their league fee.
    image: /src/assets/img/app/admin-squads.webp
    imageAlt: "The app's Squads step for a sample event: five squads with their entry, days, players filled and money collected against the league fee, and stages from Forming to Funded."
    frame: browser
    frameLabel: app.theleftoverspb.com
  - type: featureRow
    eyebrow: Setting the share
    title: A fair share, worked out for you
    body: Pick the league price and how many players are paying, backups included. The app suggests each share and tells you how short the squad would be with one player fewer.
    image: /src/assets/img/app/admin-new-squad.webp
    imageAlt: "The app's New squad form with sample data: Division 5 X-Ball at $2,500, 8 players paying, a $315 share and a note that one player fewer leaves the squad $295 short."
    frame: phone
    reverse: true
  - type: twoColumn
    tone: alt
    eyebrow: How an event comes together
    title: From request to roster
    image: /src/assets/img/events/nxl-lso26/lo2nxllso26-132-x5.webp
    imageAlt: A black and white shot of a coach in a cap and sunglasses talking Leftovers players through a clipboard.
    steps:
      - { lead: Request., text: Players ask for a spot at an event and pick the divisions they'd play. }
      - { lead: Place., text: Staff build the squads and send offers. }
      - { lead: Pay., text: Players pay their share with their reference code, and staff confirm it. }
      - { lead: Roster., text: Paid-up squads go on the league roster, ready to play. }
  - type: threeColumn
    tone: base
    eyebrow: Security and privacy
    title: Your details stay yours
    layout: centered
    iconStyle: circle
    items:
      - icon: lock
        title: Encrypted
        body: All sensitive data is encrypted, both stored and on its way to you.
      - icon: check
        title: Built to privacy standards
        body: The app follows privacy framework standards and only keeps what running the team needs.
      - icon: jersey
        title: Your account, your call
        body: Manage your details, download your data or delete your account at any time.
  - type: ctaStrip
    tone: crimson
    eyebrow: Letting players in a few at a time
    title: Get on the list
    body: Sign up now and we'll email you when you're in.
    ctas:
      - { label: Request access, href: 'https://app.theleftoverspb.com', variant: gold }
seo:
  description: The Leftovers player app. Request a spot, pay your share and follow your squad, and run an event's squads, payments and rosters from your phone.
